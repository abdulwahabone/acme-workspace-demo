# .github/workflows/impeccable-preview.yml
# One job per app in this repository (Handbook, Order desk, Storefront), each building or
# starting that app the way it needs and registering its own preview with
# Impeccable, so a review renders the app the change belongs to. No secrets:
# each job's GitHub OIDC token proves which repo and commit it is. When a step
# fails, that job's last step tells Impeccable which one, so the setup page can say.
name: impeccable preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  preview-docs:
    name: "Handbook"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Impeccable
        id: upload
        env:
          OUT: .
        working-directory: apps/docs
        run: |
          if [ ! -d "$OUT" ] || [ -z "$(find -L "$OUT" -maxdepth 2 -name index.html -print -quit)" ]; then
            echo 'Entry page not found in ".". Set the output directory for this app, or, if it is a server, choose the method that starts it' > impeccable-step.log
            cat impeccable-step.log
            exit 1
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          tar -czf site.tgz -C "$OUT" .
          REG=$(curl -sS --fail-with-body -X POST https://impeccable.reviews/api/sites/upload \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/gzip" -H "X-Impeccable-App: docs" \
            --data-binary @site.tgz) || { echo "$REG"; exit 1; }
          echo "$REG"
          echo "impeccable access check: $(echo "$REG" | jq -r '.access.detail // "not run"')"
      - name: Tell Impeccable what failed
        if: failure()
        working-directory: apps/docs
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          LOG=$({ for f in impeccable-step.log ../../impeccable-step.log app.log tunnel.log; do [ -s "$f" ] && { echo "== $f"; tail -c 3000 "$f"; }; done; true; } | sed -E 's#://([^:/@[:space:]]+):[^@[:space:]]+@#://\1:***@#g')
          jq -n --arg log "$LOG" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"outcomes": {"install": "${{ steps.install.outcome }}", "prepare": "${{ steps.prepare.outcome }}", "seed": "${{ steps.seed.outcome }}", "build": "${{ steps.build.outcome }}", "upload": "${{ steps.upload.outcome }}"}, "log": $log, "runUrl": $url, "app": "docs"}' \
            | curl -sS -X POST https://impeccable.reviews/api/previews/report \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
  preview-backoffice:
    name: "Order desk"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup
        with: { node-version: '22', cache: npm }
      - id: install
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          npm ci
      - name: Start the app
        id: start
        working-directory: apps/backoffice
        run: |
          (npm run start > app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf "http://localhost:3001/" >/dev/null && break; sleep 2; done
          curl -sf "http://localhost:3001/" >/dev/null || { echo "the app did not answer on http://localhost:3001/ within two minutes"; tail -c 3000 app.log; exit 1; }
      - name: Tunnel to Impeccable and wait for the review
        id: tunnel
        working-directory: apps/backoffice
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared && chmod +x cloudflared
          ./cloudflared tunnel --url "http://localhost:3001" --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 30); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1); [ -n "$URL" ] && break; sleep 2; done
          test -n "$URL" || { echo "no tunnel URL"; cat tunnel.log; exit 1; }
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          REG=$(curl -sS --fail-with-body -X POST https://impeccable.reviews/api/tunnels \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"url\": \"$URL\", \"app\": \"backoffice\"}")
          echo "$REG"
          POLL=$(echo "$REG" | jq -r .poll)
          POLLED="$REG"
          WAIT=2
          for i in $(seq 1 8); do
            NEXT=$(curl -sS "https://impeccable.reviews$POLL" || true)
            if echo "$NEXT" | jq -e '.access' >/dev/null 2>&1; then POLLED="$NEXT"; fi
            [ "$(echo "$POLLED" | jq -r '.access.access // "unknown"')" = "unreachable" ] || break
            sleep $WAIT; WAIT=$(( WAIT * 2 > 20 ? 20 : WAIT * 2 ))
          done
          echo "impeccable access check: $(echo "$POLLED" | jq -r '.access.detail // "not run"')"
          for i in $(seq 1 120); do
            STATE=$(curl -sS "https://impeccable.reviews$POLL" | jq -r .state)
            [ "$STATE" = "done" ] && break
            sleep 10
          done
          echo "review done; closing the tunnel"
      - name: Tell Impeccable what failed
        if: failure()
        working-directory: apps/backoffice
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          LOG=$({ for f in impeccable-step.log ../../impeccable-step.log app.log tunnel.log; do [ -s "$f" ] && { echo "== $f"; tail -c 3000 "$f"; }; done; true; } | sed -E 's#://([^:/@[:space:]]+):[^@[:space:]]+@#://\1:***@#g')
          jq -n --arg log "$LOG" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"outcomes": {"setup": "${{ steps.setup.outcome }}", "install": "${{ steps.install.outcome }}", "prepare": "${{ steps.prepare.outcome }}", "build": "${{ steps.build.outcome }}", "seed": "${{ steps.seed.outcome }}", "start": "${{ steps.start.outcome }}", "tunnel": "${{ steps.tunnel.outcome }}"}, "log": $log, "runUrl": $url, "app": "backoffice"}' \
            | curl -sS -X POST https://impeccable.reviews/api/previews/report \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
  preview-storefront:
    name: "Storefront"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup
        with: { node-version: '22', cache: npm }
      - id: install
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          npm ci
      - id: build
        shell: bash
        working-directory: apps/storefront
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          npm run build
      - name: Upload to Impeccable
        id: upload
        env:
          OUT: dist
        working-directory: apps/storefront
        run: |
          if [ ! -d "$OUT" ] || [ -z "$(find -L "$OUT" -maxdepth 2 -name index.html -print -quit)" ]; then
            echo 'Entry page not found in "dist". Set the output directory for this app, or, if it is a server, choose the method that starts it' > impeccable-step.log
            cat impeccable-step.log
            exit 1
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          tar -czf site.tgz -C "$OUT" .
          REG=$(curl -sS --fail-with-body -X POST https://impeccable.reviews/api/sites/upload \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/gzip" -H "X-Impeccable-App: storefront" \
            --data-binary @site.tgz) || { echo "$REG"; exit 1; }
          echo "$REG"
          echo "impeccable access check: $(echo "$REG" | jq -r '.access.detail // "not run"')"
      - name: Tell Impeccable what failed
        if: failure()
        working-directory: apps/storefront
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          LOG=$({ for f in impeccable-step.log ../../impeccable-step.log app.log tunnel.log; do [ -s "$f" ] && { echo "== $f"; tail -c 3000 "$f"; }; done; true; } | sed -E 's#://([^:/@[:space:]]+):[^@[:space:]]+@#://\1:***@#g')
          jq -n --arg log "$LOG" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"outcomes": {"setup": "${{ steps.setup.outcome }}", "install": "${{ steps.install.outcome }}", "prepare": "${{ steps.prepare.outcome }}", "seed": "${{ steps.seed.outcome }}", "build": "${{ steps.build.outcome }}", "upload": "${{ steps.upload.outcome }}"}, "log": $log, "runUrl": $url, "app": "storefront"}' \
            | curl -sS -X POST https://impeccable.reviews/api/previews/report \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
# If your site is built under a subpath (SvelteKit paths.base, Next basePath),
# tar the PARENT of the output so its assets resolve, and add
# -H "X-Impeccable-Base-Path: /that-path" to the upload.
